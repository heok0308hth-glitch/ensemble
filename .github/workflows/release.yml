name: Release

# Bump VERSION in gradle.properties and add a CHANGELOG section: this workflow tags the
# release, attaches the jars and asks JitPack to build it. Nothing to do by hand.
on:
  push:
    branches: [main]
    paths: [gradle.properties, CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: echo "version=$(grep '^VERSION=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v6
        if: steps.exists.outputs.yes == 'false'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        if: steps.exists.outputs.yes == 'false'
      - name: Test and build jars
        if: steps.exists.outputs.yes == 'false'
        run: ./gradlew :ensemble:test :ensemble:jar :ensemble:sourcesJar --no-daemon
      - name: Release notes from CHANGELOG
        if: steps.exists.outputs.yes == 'false'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          printf '\n\n```kotlin\nrepositories { maven("https://jitpack.io") }\ndependencies { implementation("com.github.heok0308hth-glitch.ensemble:ensemble:v%s") }\n```\n' "${{ steps.v.outputs.version }}" >> notes.md
      - name: Create release
        if: steps.exists.outputs.yes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "Ensemble v${{ steps.v.outputs.version }}" \
            --notes-file notes.md \
            ensemble/build/libs/*.jar
  jitpack:
    # Requesting the POM makes JitPack build the tag now instead of on a user's first download.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build on JitPack
        run: |
          v="v$(grep '^VERSION=' gradle.properties | cut -d= -f2)"
          base="https://jitpack.io/com/github/heok0308hth-glitch/ensemble"
          for i in 1 2 3; do
            for url in "$base/ensemble/$v/ensemble-$v.pom" "$base/$v/ensemble-$v.pom"; do
              code=$(curl -s -o pom.xml -w '%{http_code}' --max-time 900 "$url") || code=000
              echo "attempt $i · $url → HTTP $code"
              if [ "$code" = 200 ]; then head -c 600 pom.xml; echo; echo "### JitPack: $v is available at $url" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            done
            sleep 60
          done
          echo "--- JitPack build log (tail)"
          curl -s "$base/$v/build.log" | tail -60
          echo "### JitPack has not published $v yet — see https://jitpack.io/#heok0308hth-glitch/ensemble" >> "$GITHUB_STEP_SUMMARY"
